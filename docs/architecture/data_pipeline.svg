<text x="536" y="408" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">Haversine 거리 → 반경 내 가까운 장소 선별</text>
<text x="536" y="431" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">장소 코드 중복 제거 → 5분 캐시 확인</text>
<text x="536" y="454" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">여러 지역 비동기 조회 → 개별 실패 분리</text>
<text x="536" y="477" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">인구 범위·혼잡도·측정 시각 변환</text>
<rect x="40" y="630" width="440" height="135" rx="8" fill="#f0f7f3" stroke="#56866e" stroke-width="1.8"/>
<text x="56" y="661" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" fill="#000000" text-anchor="start">공통 데이터 응답</text>
<text x="56" y="693" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">날씨: current / hourly / daily / weekly</text>
<text x="56" y="716" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">인구: 위치·거리·인구 범위·혼잡도·시각</text>
<text x="56" y="739" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">화면에서는 결과와 오류 상태를 별도 관리</text>
<rect x="520" y="630" width="440" height="135" rx="8" fill="#eff6fa" stroke="#397a99" stroke-width="1.8"/>
<text x="536" y="661" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="700" fill="#000000" text-anchor="start">지도 시설과 결합</text>
<text x="536" y="693" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">지역·카테고리 검색 → 좌표 형식 변환</text>
<text x="536" y="716" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">시설 좌표에서 1.5km 내 측정지역 조회</text>
<text x="536" y="739" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">가장 가까운 측정지역을 시설 마커에 연결</text>
<text x="28" y="884" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="15" fill="#53616d">공개용 정리 2026-11-24 · 현재 보관 소스 기준</text>
