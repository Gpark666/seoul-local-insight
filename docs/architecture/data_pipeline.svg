<text x="56" y="454" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">현재·초단기·단기 조회 / 중기 육상·기온 병렬 조회</text>
<text x="56" y="477" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#1a2832" text-anchor="start">공통 항목 정리·체감온도·중복 날짜 제거</text>
<rect x="520" y="345" width="440" height="185" rx="8" fill="#eff6fa" stroke="#397a99" stroke-width="1.8"/>
